spring.application.name=APIX

server.port=${PORT:8080}


spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

apix.performance.minimum-samples=${APIX_PERFORMANCE_MINIMUM_SAMPLES:5}
apix.performance.latency-regression-threshold=${APIX_PERFORMANCE_LATENCY_THRESHOLD:0.10}
apix.performance.throughput-regression-threshold=${APIX_PERFORMANCE_THROUGHPUT_THRESHOLD:0.10}
apix.performance.error-rate-increase-threshold=${APIX_PERFORMANCE_ERROR_RATE_THRESHOLD:0.01}
apix.outbound.allowed-local-hosts=${APIX_OUTBOUND_ALLOWED_LOCAL_HOSTS:}
apix.outbound.connect-timeout-ms=${APIX_OUTBOUND_CONNECT_TIMEOUT_MS:5000}
apix.outbound.response-timeout-ms=${APIX_OUTBOUND_RESPONSE_TIMEOUT_MS:30000}
apix.outbound.dns-timeout-ms=${APIX_OUTBOUND_DNS_TIMEOUT_MS:3000}
apix.outbound.max-connections=${APIX_OUTBOUND_MAX_CONNECTIONS:50}
apix.outbound.max-pending-acquires=${APIX_OUTBOUND_MAX_PENDING_ACQUIRES:100}
apix.outbound.max-body-bytes=${APIX_OUTBOUND_MAX_BODY_BYTES:1048576}
apix.outbound.max-load-test-requests=${APIX_OUTBOUND_MAX_LOAD_TEST_REQUESTS:50}
apix.otel.ui-base-url=${APIX_OTEL_UI_BASE_URL:https://all-in-one-production-a9d1.up.railway.app/trace/}


spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
apix.oauth.frontend-success-url=${APIX_OAUTH_FRONTEND_SUCCESS_URL:https://apix-xray.vercel.app/oauth-success}

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo

openai.api.key=${OPENROUTER_API_KEY}
openai.url=https://openrouter.ai/api/v1/chat/completions
openai.model=openai/gpt-4.1-mini
